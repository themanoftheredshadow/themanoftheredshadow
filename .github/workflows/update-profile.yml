name: Update profile

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
  push:
    paths:
      - "profile.config.json"
      - "scripts/update_profile.py"

permissions:
  contents: write
concurrency:
  group: update-profile
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generar skills, proyectos y estadísticas
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: python scripts/update_profile.py

      - name: Guardar cambios
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/stats.svg assets/languages.svg
          git diff --cached --quiet || git commit -m "chore: actualizar perfil automáticamente"
          git push
