name: Update profile

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
  push:
    paths:
      - "profile.config.json"
      - "scripts/update_profile.py"

permissions:
  contents: write

concurrency:
  group: update-profile
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configurar Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # 1. Sincronizamos primero con el servidor con el workspace limpio
          git pull origin main --rebase

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generar skills, proyectos y estadísticas
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: python scripts/update_profile.py

      - name: Guardar y subir cambios
        run: |
          # 2. Añadimos los archivos modificados por Python
          git add README.md assets/stats.svg assets/languages.svg

          if git diff --cached --quiet; then
            echo "No hay cambios que guardar."
            exit 0
          fi

          # 3. Hacemos commit y subimos directamente
          git commit -m "chore: actualizar perfil automáticamente"
          git push origin HEAD:main
